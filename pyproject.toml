[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamvault"
version = "0.1.0"
description = "Film licensing market analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "python-dotenv",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]